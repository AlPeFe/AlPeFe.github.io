name: refrescar actividad de GitHub

# Una vez al día, y a mano cuando haga falta: redibuja el grafo de
# contribuciones de la portada y las fechas de "último cambio" de /proyectos.
# Todo sale de la API pública de GitHub, así que puede correr en la nube.
# (Los tokens de la portada los actualiza una tarea LOCAL: viven en los
# registros de sesión de HanniPI de la máquina — scripts/update-tokens.mjs.)
#
# Para ver también los repositorios privados hace falta un token personal con
# permiso de lectura de repositorios, guardado como secreto `ALPEFE_TOKEN`
# (Settings → Secrets and variables → Actions → New repository secret).

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC, todos los días
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Redibujar contribuciones y leer fechas de la API de GitHub
        env:
          GH_TOKEN: ${{ secrets.ALPEFE_TOKEN }}
        run: node scripts/update-live.mjs

      - name: Commit y push si algo cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios hoy."
            exit 0
          fi
          git add index.html projects/index.html
          git commit -m "chore: refrescar contribuciones y fechas desde GitHub"
          git push
